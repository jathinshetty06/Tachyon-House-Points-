<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tachyon House Points</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#07080f;--panel:#0f111c;--line:#23263a;--text:#eef0ff;--mute:#8b90ad;--a:#27e0ff;--i:#ff2d3d;--m:#a6ff4f;--l:#ff8a1f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif}
.app{display:grid;grid-template-columns:380px 1fr;height:100%}
aside{padding:22px;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:26px;line-height:1.1;margin:0;letter-spacing:-.02em}
h1 small{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:6px;letter-spacing:0}
h2{font-size:14px;font-weight:600;margin:0 0 10px;color:var(--mute)}
.houses{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.houses button{padding:11px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font:600 14px inherit;font-family:inherit;cursor:pointer;transition:.2s}
.houses button[aria-pressed=true]{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 18px -4px var(--c);color:var(--c)}
.row{display:flex;gap:8px;margin-top:10px}
input{flex:1;min-width:0;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#080912;color:var(--text);font:600 16px inherit;font-family:inherit}
.go{padding:11px 18px;border-radius:10px;border:0;background:var(--text);color:#07080f;font:700 14px inherit;font-family:inherit;cursor:pointer}
.go:active{transform:scale(.96)}
button:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.msg{min-height:18px;font-size:13px;color:var(--i);margin-top:6px}
.board{position:relative;height:256px}
.lr{position:absolute;left:0;right:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#0a0b15;transition:transform .7s cubic-bezier(.2,.9,.2,1),border-color .3s}
.lr .rk{width:26px;font-weight:700;color:var(--mute)}
.lr .nm{flex:1;font-weight:600}.lr .pt{font-weight:700;font-variant-numeric:tabular-nums}
.lr .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.lr.win{border-color:var(--c);box-shadow:0 0 22px -8px var(--c)}
.winner{padding:14px;border-radius:12px;background:linear-gradient(120deg,#1a1d33,#0f111c);border:1px solid var(--line);font-size:14px;color:var(--mute)}
.winner b{display:block;font-size:22px;color:var(--text);margin-top:2px}
.tools{display:flex;gap:8px}.tools button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mute);font-family:inherit;cursor:pointer}
.tools button:hover{color:var(--text)}
.log{font-size:12px;color:var(--mute);max-height:90px;overflow:auto;margin:0;padding-left:16px}
main{position:relative;min-height:0}
#stage{position:absolute;inset:0}
.lab{position:absolute;left:0;top:0;will-change:transform;transform:translate(-50%,-100%);pointer-events:none;text-align:center;font-weight:700;text-shadow:0 2px 10px #000;white-space:nowrap}
.lab span{display:block;font-size:14px;font-weight:700;letter-spacing:.04em}.lab em{font-style:normal;font-size:26px}
.hint{position:absolute;right:16px;bottom:12px;font-size:12px;color:var(--mute)}
.pop{position:absolute;font-weight:700;font-size:30px;pointer-events:none;transform:translate(-50%,-100%);text-shadow:0 0 18px currentColor;animation:pop 1.1s ease-out forwards}
@keyframes pop{from{translate:0 0;opacity:1;scale:.5}30%{scale:1.3}to{translate:0 -90px;opacity:0;scale:1}}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#000b 100%)}
.bar{position:absolute;left:0;right:0;height:0;background:#000;pointer-events:none;transition:height 1.2s ease;z-index:2}.bar.top{top:0}.bar.bot{bottom:0}.cine .bar{height:7%}
.cap{position:absolute;left:0;right:0;bottom:1.8%;text-align:center;font-weight:600;letter-spacing:.12em;font-size:14px;color:#fff;opacity:0;transition:opacity .4s;z-index:3;pointer-events:none;text-shadow:0 2px 12px #000}.cap.on{opacity:1}
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:3;animation:ttl 4s ease forwards}
.title b{font-size:clamp(28px,6vw,56px);letter-spacing:.35em;font-weight:700}.title span{color:var(--mute);letter-spacing:.2em;margin-top:8px;font-size:13px}
@keyframes ttl{0%{opacity:0;letter-spacing:.8em}25%,70%{opacity:1}100%{opacity:0;visibility:hidden}}
.ctl{position:absolute;left:12px;top:12px;z-index:4;display:flex;gap:6px;flex-wrap:wrap;max-width:50%}
.tl{position:absolute;right:12px;top:12px;z-index:4;width:min(300px,44%);height:auto;border:1px solid var(--line);border-radius:12px;background:#0b0d18cc}
.ctl button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#0b0d18cc;color:var(--text);font:600 12px inherit;font-family:inherit;cursor:pointer}
@media(max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:46% 1fr;}main{order:-1}aside{border-right:0;border-top:1px solid var(--line)}.lab em{font-size:18px}}
@media(prefers-reduced-motion:reduce){.lr{transition:none}}
</style>
</head>
<body>
<div class="app">
<aside>
  <h1>Tachyon House Points<small>Score the four houses and watch the standings rise.</small></h1>
  <section>
    <h2>Add points</h2>
    <div class="houses" id="pick" role="group" aria-label="Choose house"></div>
    <div class="row"><input id="pts" type="number" inputmode="numeric" min="1" step="1" placeholder="Points earned" aria-label="Points earned"><button class="go" id="add">Add points</button></div>
    <div class="msg" id="msg" role="alert"></div>
  </section>
  <section><h2>Rankings</h2><div class="board" id="board"></div></section>
  <div class="winner" id="win"></div>
  <div class="tools"><button id="undo">Undo last</button><button id="reset">Reset all</button></div>
  <ol class="log" id="log" reversed></ol>
</aside>
<main><div id="stage"></div><div class="vig"></div><div class="bar top"></div><div class="bar bot"></div><div class="cap" id="cap"></div><div class="title"><b>TACHYON</b><span>House Cup · Live Standings</span></div><div class="ctl"><button id="cin" aria-pressed="true">Cinematic: On</button><button id="rp">▶ Replay</button><button id="snd" aria-pressed="false">Sound: Off</button></div><canvas class="tl" id="tl" width="600" height="200" aria-label="Score timeline chart"></canvas><div class="hint">Every score sends a time-echo ring back down the tunnel</div></main>
</div>
<script>
const HOUSES=[{n:'ALPHA',c:'#27e0ff'},{n:'INFER',c:'#ff2d3d'},{n:'MATRIX',c:'#a6ff4f'},{n:'LAYER',c:'#ff8a1f'}];
let state={pts:{ALPHA:0,INFER:0,MATRIX:0,LAYER:0},log:[]},sel='ALPHA';
try{const s=JSON.parse(localStorage.getItem('tachyon-points')||'null');if(s&&s.pts&&Array.isArray(s.log))state=s}catch(e){}
const save=()=>{if(window.__replay)return;try{localStorage.setItem('tachyon-points',JSON.stringify(state))}catch(e){}};
const $=id=>document.getElementById(id);

/* Ranking: sort by points (high to low); equal scores share a rank (1,1,3). */
function rank(){
  const arr=HOUSES.map(h=>({...h,p:state.pts[h.n]})).sort((a,b)=>b.p-a.p);
  let r=0;arr.forEach((h,i)=>{if(i===0||h.p!==arr[i-1].p)r=i+1;h.r=r});return arr;
}

/* UI */
const pick=$('pick'),board=$('board'),rows={};
HOUSES.forEach(h=>{
  const b=document.createElement('button');b.textContent=h.n;b.style.setProperty('--c',h.c);
  b.onclick=()=>{sel=h.n;sync()};b.dataset.n=h.n;pick.appendChild(b);
  const r=document.createElement('div');r.className='lr';r.style.setProperty('--c',h.c);
  r.innerHTML='<span class="rk"></span><span class="dot"></span><span class="nm">'+h.n+'</span><span class="pt">0</span>';
  board.appendChild(r);rows[h.n]=r;
});
const disp={ALPHA:0,INFER:0,MATRIX:0,LAYER:0};
function sync(){
  [...pick.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.n===sel));
  const rk=rank();
  rk.forEach((h,i)=>{const r=rows[h.n];r.style.transform='translateY('+i*66+'px)';r.querySelector('.rk').textContent='#'+h.r;r.classList.toggle('win',h.r===1&&h.p>0)});
  const top=rk.filter(h=>h.r===1&&h.p>0);
  $('win').innerHTML=top.length?(top.length>1?'Tie for first place':'Winning house')+'<b>'+top.map(h=>h.n).join(' & ')+' · '+top[0].p+' pts</b>':'No winner yet<b>Add points to start the race</b>';
  $('log').innerHTML=state.log.slice(-6).map(l=>'<li>'+l.h+' +'+l.p+'</li>').join('');
  save();
}
function add(){if(window.__replay)return;
  const v=Number($('pts').value),m=$('msg');m.textContent='';
  if(!Number.isInteger(v)||v<=0){m.textContent='Enter a whole number greater than 0.';return}
  if(v>100000){m.textContent='Enter 100,000 points or fewer at a time.';return}
  const h=sel;$('pts').value='';pulse(h,v,()=>commit(h,v));
}
$('add').onclick=add;$('pts').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
$('undo').onclick=()=>{if(window.__replay||pend)return;const l=state.log.pop();if(l){state.pts[l.h]-=l.p;sync()}};
$('reset').onclick=()=>{if(window.__replay||pend)return;if(confirm('Reset all house points to zero?')){HOUSES.forEach(h=>state.pts[h.n]=0);state.log=[];sync()}};

/* 3D scene: score pillars in a tachyon warp tunnel. All motion is time-based (smooth at any frame rate). */
const stage=$('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x07080f,.018);
const cam=new THREE.PerspectiveCamera(45,1,.1,200);
scene.add(new THREE.AmbientLight(0x6670aa,.8));
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(5,12,8);scene.add(dl);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const pal=HOUSES.map(h=>new THREE.Color(h.c)),white=new THREE.Color(0xffffff),GOLD=new THREE.Color(0xffd34d);
const gc=document.createElement('canvas');gc.width=gc.height=128;
{const x=gc.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128)}
const glowTex=new THREE.CanvasTexture(gc);
const sprite=(c,sz,o)=>{const m=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:c,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:o}));m.scale.set(sz,sz,1);scene.add(m);return m};

/* platform */
const floor=new THREE.Mesh(new THREE.CylinderGeometry(9,9.4,.4,64),new THREE.MeshStandardMaterial({color:0x10131f,metalness:.6,roughness:.4}));floor.position.y=-.2;scene.add(floor);
const ring=new THREE.Mesh(new THREE.TorusGeometry(8.6,.04,8,128),new THREE.MeshBasicMaterial({color:0x27e0ff}));ring.rotation.x=Math.PI/2;scene.add(ring);
const grid=new THREE.GridHelper(18,18,0x2a2f4d,0x171a2b);grid.position.y=.01;scene.add(grid);

/* warp streaks + gates */
const SN=900,sp=new Float32Array(SN*6),sc=new Float32Array(SN*6),sd=[];
for(let i=0;i<SN;i++){const a=Math.random()*6.283,r=11+Math.random()*28,c=Math.random()<.3?white:pal[i%4];sd.push({x:Math.cos(a)*r,y:2.5+Math.sin(a)*r*.75,z:-Math.random()*90+12});sc.set([c.r,c.g,c.b,0,0,0],i*6)}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));sg.setAttribute('color',new THREE.BufferAttribute(sc,3));
const streaks=new THREE.LineSegments(sg,new THREE.LineBasicMaterial({vertexColors:true,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));streaks.frustumCulled=false;scene.add(streaks);
const gates=[];for(let i=0;i<7;i++){const g=new THREE.Mesh(new THREE.TorusGeometry(17,.07,6,72),new THREE.MeshBasicMaterial({color:0x3a4cc0,transparent:true,opacity:.35,blending:THREE.AdditiveBlending}));g.position.set(0,2.5,-i*14);scene.add(g);gates.push(g)}

/* pillars */
const P={};
HOUSES.forEach((h,i)=>{
  const col=pal[i];
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(2,1,2),new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.35,metalness:.3,roughness:.3}));mesh.position.x=(i-1.5)*3.2;scene.add(mesh);
  const base=new THREE.Mesh(new THREE.BoxGeometry(2.4,.2,2.4),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.35}));base.position.set(mesh.position.x,.1,0);scene.add(base);
  const crown=new THREE.Mesh(new THREE.OctahedronGeometry(.45),new THREE.MeshStandardMaterial({color:GOLD,emissive:0xffa500,emissiveIntensity:.8}));crown.visible=false;scene.add(crown);
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(.15,.7,22,24,1,true),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));beam.visible=false;scene.add(beam);
  const lab=document.createElement('div');lab.className='lab';lab.style.color='#fff';lab.innerHTML='<span>'+h.n+'</span><em>0</em>';stage.appendChild(lab);
  P[h.n]={mesh,crown,beam,lab,halo:sprite(col,4,.5),h:.05,hv:0,kick:0,cs:0,col,txt:'',val:-1};
});
const flare=sprite(0xffffff,1,0);flare.scale.set(18,1.4,1);let flareA=0;

/* 4th dimension: score history ribbons stretching back through time */
const HN=14,TS=2.2,hist={};
HOUSES.forEach((h,i)=>{
  const g=new THREE.BufferGeometry(),pos=new Float32Array((HN+1)*3),col=new Float32Array((HN+1)*3);
  for(let k=0;k<=HN;k++){const f=1-k/HN;col.set([pal[i].r*f,pal[i].g*f,pal[i].b*f],k*3)}
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const L=new THREE.Line(g,new THREE.LineBasicMaterial({vertexColors:true,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));L.frustumCulled=false;scene.add(L);
  const D=new THREE.Points(g,new THREE.PointsMaterial({size:.3,map:glowTex,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));D.frustumCulled=false;scene.add(D);
  hist[h.n]={g,pos,ys:new Array(HN+1).fill(0),x:(i-1.5)*3.2};
});
let sigNow='';
function rebuildHist(){
  const max=Math.max(10,...HOUSES.map(h=>state.pts[h.n]));
  const cur={ALPHA:0,INFER:0,MATRIX:0,LAYER:0},cum=[{...cur}];
  state.log.forEach(l=>{cur[l.h]+=l.p;cum.push({...cur})});
  HOUSES.forEach(h=>{const H=hist[h.n];for(let k=0;k<=HN;k++)H.ys[k]=cum[Math.max(0,cum.length-1-k)][h.n]/max*5.6});
  drawTL(cum,max);
}
function drawTL(cum,max){
  const c=$('tl'),x=c.getContext('2d'),W=c.width,H=c.height,pad=16,top=44,bot=H-18;
  x.clearRect(0,0,W,H);x.font='600 15px system-ui,sans-serif';x.fillStyle='#8b90ad';x.fillText('Score timeline',pad,24);x.font='600 13px system-ui,sans-serif';
  HOUSES.forEach((h,i)=>{const lx=W-pad-(4-i)*88;x.fillStyle=h.c;x.fillRect(lx,13,10,10);x.fillStyle='#c9ccdf';x.fillText(h.n,lx+15,23)});
  x.strokeStyle='#23263a';x.lineWidth=1;x.beginPath();x.moveTo(pad,bot);x.lineTo(W-pad,bot);x.stroke();
  const N=cum.length-1;
  if(N<1){x.fillStyle='#8b90ad';x.textAlign='center';x.fillText('Add points to start the timeline',W/2,H/2+14);x.textAlign='left';return}
  HOUSES.forEach(h=>{x.strokeStyle=h.c;x.lineWidth=3;x.lineJoin='round';x.shadowColor=h.c;x.shadowBlur=8;x.beginPath();
    cum.forEach((s,j)=>{const px=pad+j/N*(W-2*pad),py=bot-s[h.n]/max*(bot-top);j?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();
    x.fillStyle=h.c;x.beginPath();x.arc(W-pad,bot-cum[N][h.n]/max*(bot-top),5,0,6.283);x.fill();x.shadowBlur=0});
}

/* director + captions */
let cinOn=!reduce,epic=0,epicN='ALPHA',dirT=0,dirN='ALPHA',dw=0,ew=0,introT=0,capT=0,pend=0;
const mainEl=document.querySelector('main'),capEl=$('cap'),cinB=$('cin');
function setCin(on){cinOn=on;mainEl.classList.toggle('cine',on);cinB.textContent='Cinematic: '+(on?'On':'Off');cinB.setAttribute('aria-pressed',on)}
cinB.onclick=()=>{setCin(!cinOn);if(cinOn)introT=0};setCin(cinOn);
function caption(txt,ms){capEl.textContent=txt;capEl.classList.add('on');clearTimeout(capT);capT=setTimeout(()=>capEl.classList.remove('on'),ms||2000)}
setTimeout(()=>caption('FOUR HOUSES \u00b7 ONE CUP',2600),3600);

/* sound: scheduled on the audio clock so it lands exactly on the visual hit */
let ac=null,sndOn=false;
function tone(f1,f2,d,type,vol,delay){if(!sndOn||!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+(delay||0);
  o.type=type;o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+d+.05)}
$('snd').onclick=()=>{sndOn=!sndOn;if(sndOn&&!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac&&ac.state==='suspended')ac.resume();$('snd').textContent='Sound: '+(sndOn?'On':'Off');$('snd').setAttribute('aria-pressed',sndOn);tone(300,600,.15,'sine',.1)};

/* particles: one draw call for sparks, trails and confetti */
const PN=1000,pp=new Float32Array(PN*3).fill(-999),pcol=new Float32Array(PN*3),pbase=new Float32Array(PN*3),pv=new Float32Array(PN*3),pl=new Float32Array(PN),pml=new Float32Array(PN),pgv=new Float32Array(PN);let pcur=0;
const pgeo=new THREE.BufferGeometry();pgeo.setAttribute('position',new THREE.BufferAttribute(pp,3));pgeo.setAttribute('color',new THREE.BufferAttribute(pcol,3));
const pts=new THREE.Points(pgeo,new THREE.PointsMaterial({size:.4,map:glowTex,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));pts.frustumCulled=false;scene.add(pts);
function emit(x,y,z,c,vx,vy,vz,life,g){const j=pcur++%PN;pp.set([x,y,z],j*3);pv.set([vx,vy,vz],j*3);pbase.set([c.r,c.g,c.b],j*3);pl[j]=pml[j]=life;pgv[j]=g}
function stepParticles(d){
  for(let j=0;j<PN;j++){if(pl[j]<=0)continue;pl[j]-=d;const i3=j*3;
    if(pl[j]<=0){pp[i3]=pp[i3+1]=pp[i3+2]=-999;pcol[i3]=pcol[i3+1]=pcol[i3+2]=0;continue}
    pv[i3+1]-=pgv[j]*d;pp[i3]+=pv[i3]*d;pp[i3+1]+=pv[i3+1]*d;pp[i3+2]+=pv[i3+2]*d;
    const f=pl[j]/pml[j];pcol[i3]=pbase[i3]*f;pcol[i3+1]=pbase[i3+1]*f;pcol[i3+2]=pbase[i3+2]*f}
  pgeo.attributes.position.needsUpdate=true;pgeo.attributes.color.needsUpdate=true;
}

/* effects: comet strike -> impact (score is committed on impact) */
const fx=[],cometGeo=new THREE.SphereGeometry(.38,16,16),cometMat=new THREE.MeshBasicMaterial({color:0xffffff}),ringGeo=new THREE.RingGeometry(.9,1.1,64),echoGeo=new THREE.TorusGeometry(9,.08,8,96);
let boost=0,shake=0;
function pulse(n,p,done){
  const o=P[n],m=new THREE.Mesh(cometGeo,cometMat);m.position.set(o.mesh.position.x,14,0);scene.add(m);
  pend++;boost=Math.min(1.6,boost+.9);dirN=n;dirT=2;
  tone(900,120,.55,'sawtooth',.04);tone(160,40,.5,'sine',.25,.55);tone(1200,300,.15,'square',.03,.55);
  fx.push({type:'comet',m,n,p,age:0,done});
}
function impact(f){
  const o=P[f.n],x=o.mesh.position.x,col=o.col;pend--;
  if(f.done)f.done();
  const y=o.h+.3;
  for(let i=0;i<70;i++){const a=Math.random()*6.283,s=3+Math.random()*9;emit(x,y,0,i%4?col:white,Math.cos(a)*s,5+Math.random()*13,Math.sin(a)*s,1.2,40)}
  const r=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.8,side:THREE.DoubleSide}));r.rotation.x=-Math.PI/2;r.position.set(x,.08,0);scene.add(r);fx.push({type:'ring',m:r,age:0});
  const eo=new THREE.Mesh(echoGeo,new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false}));eo.position.set(0,3,3);scene.add(eo);fx.push({type:'echo',m:eo,age:0});
  o.kick=1.6;shake=Math.max(shake,.5);flare.position.set(x,y,0);flareA=1;
  caption(f.n+'  +'+f.p);
  const q=new THREE.Vector3(x,y+1,0).project(cam),d=document.createElement('div');d.className='pop';d.textContent='+'+f.p;d.style.color='#'+col.getHexString();
  d.style.left=((q.x*.5+.5)*stage.clientWidth)+'px';d.style.top=((-q.y*.5+.5)*stage.clientHeight)+'px';stage.appendChild(d);setTimeout(()=>d.remove(),1100);
}
function leadNames(){const r=rank();return r[0].p>0?r.filter(x=>x.r===1).map(x=>x.n).join():''}
function commit(h,p){const b=leadNames();state.pts[h]+=p;state.log.push({h,p});sync();if(leadNames()!==b)confetti()}
function confetti(){
  shake=1.2;boost=2;epic=3.2;epicN=rank()[0].n;flare.position.set(0,7,0);flareA=1.4;
  caption('NEW LEADER \u00b7 '+leadNames().replace(/,/g,' & '),3000);tone(220,880,1.2,'triangle',.12);tone(330,1320,1.2,'triangle',.08);
  for(let i=0;i<220;i++)emit((Math.random()-.5)*14,11+Math.random()*4,(Math.random()-.5)*6,i%5?pal[i%4]:white,(Math.random()-.5)*3.6,-1.2-Math.random()*2.4,(Math.random()-.5)*3,4,2.9);
}
function stepFx(dt,wdt){
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];
    if(f.type==='comet'){f.age+=dt;const k=Math.min(1,f.age/.55),o=P[f.n];f.m.position.y=14+(o.h+.3-14)*Math.pow(k,2.2);
      for(let q=0;q<2;q++)emit(o.mesh.position.x+(Math.random()-.5)*.2,f.m.position.y+q*.3,0,o.col,0,0,0,.35,0);
      if(k>=1){impact(f);scene.remove(f.m);fx.splice(i,1)}}
    else if(f.type==='echo'){f.age+=wdt;f.m.position.z-=50*wdt;f.m.material.opacity=Math.max(0,.8-f.age*.45);if(f.m.material.opacity<=0){scene.remove(f.m);f.m.material.dispose();fx.splice(i,1)}}
    else{f.age+=wdt;const k=f.age/.9;f.m.scale.setScalar(1+k*9);f.m.material.opacity=.8*(1-k);if(k>=1){scene.remove(f.m);f.m.material.dispose();fx.splice(i,1)}}
  }
}

/* replay: rewind to zero, then re-run every score as a time-lapse */
let replaying=false;
$('rp').onclick=async()=>{
  if(replaying||pend||!state.log.length)return;
  replaying=true;window.__replay=true;
  const back=JSON.parse(JSON.stringify(state)),wait=ms=>new Promise(r=>setTimeout(r,ms));
  HOUSES.forEach(h=>state.pts[h.n]=0);state.log=[];sync();
  caption('REPLAY \u00b7 '+back.log.length+' EVENTS',1800);await wait(1600);
  for(const l of back.log){await new Promise(r=>pulse(l.h,l.p,()=>{commit(l.h,l.p);r()}));await wait(750)}
  await wait(1500);state.pts=back.pts;state.log=back.log;window.__replay=false;replaying=false;sync();
};

let mx=0,my=0,portrait=false;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);cam.aspect=w/h;portrait=w/h<1;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();

const vv=new THREE.Vector3(),camPos=new THREE.Vector3(0,12,34),camLook=new THREE.Vector3(0,2.6,0),tPos=new THREE.Vector3(),tLook=new THREE.Vector3(),aPos=new THREE.Vector3(),aLook=new THREE.Vector3();
let tsS=1,bs=0,fl=0,pr=Math.min(devicePixelRatio,2),emaDt=.016,slowT=0;
let t=0,last=performance.now()/1000;
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now()/1000,dt=Math.min(.05,now-last);last=now;t+=dt;
  const E=r=>1-Math.exp(-r*dt);tsS+=(((cinOn&&epic>0)?.4:1)-tsS)*E(5);const wdt=dt*tsS;
  bs+=(boost-bs)*E(9);fl+=(flareA-fl)*E(28);
  emaDt+=(dt-emaDt)*.05;if(emaDt>.026&&pr>1){slowT+=dt;if(slowT>1){pr=Math.max(1,pr-.25);renderer.setPixelRatio(pr);renderer.setSize(stage.clientWidth,stage.clientHeight);slowT=0}}else slowT=0;
  epic=Math.max(0,epic-dt);dirT=Math.max(0,dirT-dt);introT+=dt;
  const max=Math.max(10,...HOUSES.map(h=>state.pts[h.n]));
  const rk=rank(),winners=rk.filter(h=>h.r===1&&h.p>0);
  const sn=state.log.length+':'+HOUSES.map(h=>state.pts[h.n]).join();if(sn!==sigNow){sigNow=sn;rebuildHist()}
  boost*=Math.exp(-3*dt);shake*=Math.exp(-6*dt);
  const speed=(reduce?5:14)+(reduce?0:bs*110);
  for(let i=0;i<SN;i++){const s=sd[i];s.z+=speed*wdt;if(s.z>14)s.z-=104;const len=.5+speed*.06;
    sp[i*6]=s.x;sp[i*6+1]=s.y;sp[i*6+2]=s.z;sp[i*6+3]=s.x;sp[i*6+4]=s.y;sp[i*6+5]=s.z-len}
  sg.attributes.position.needsUpdate=true;
  gates.forEach(g=>{g.position.z+=speed*wdt;if(g.position.z>14)g.position.z-=98});
  HOUSES.forEach(hh=>{
    const n=hh.n,o=P[n],win=winners.some(w=>w.n===n),me=rk.find(x=>x.n===n);
    o.hv+=((Math.max(.05,state.pts[n]/max*5.6)-o.h)*70-o.hv*11)*dt;o.h=Math.max(.05,o.h+o.hv*dt);o.kick*=Math.exp(-5*dt);o.kv=(o.kv||0)+(o.kick-(o.kv||0))*E(16);
    const h=o.h+o.kv*.25;
    o.mesh.scale.y=h;o.mesh.position.y=h/2;o.mesh.material.emissiveIntensity=.35+o.kv*1.2;
    o.halo.position.set(o.mesh.position.x,h+.2,0);o.halo.scale.setScalar(4+o.kv*3);o.halo.material.opacity=.45+o.kv*.4;
    {const H=hist[n];for(let q=0;q<=HN;q++){H.pos[q*3]=H.x;H.pos[q*3+1]=(q?H.ys[q]:o.h)+.03;H.pos[q*3+2]=-q*TS}H.g.attributes.position.needsUpdate=true}
    o.cs+=((win?1:0)-o.cs)*E(6);o.crown.visible=o.beam.visible=o.cs>.01;
    if(o.crown.visible){o.crown.scale.setScalar(o.cs);o.crown.position.set(o.mesh.position.x,h+.9+Math.sin(t*2)*.12,0);o.crown.rotation.y=t*2;
      o.beam.position.set(o.mesh.position.x,11,0);o.beam.material.opacity=(.12+Math.sin(t*3)*.04)*o.cs}
    disp[n]+=(state.pts[n]-disp[n])*E(7);
    vv.set(o.mesh.position.x,h+.5+1.1*o.cs,0).project(cam);
    o.lab.style.transform='translate3d('+((vv.x*.5+.5)*stage.clientWidth).toFixed(2)+'px,'+Math.max(70+(cinOn?.07*stage.clientHeight:0),(-vv.y*.5+.5)*stage.clientHeight).toFixed(2)+'px,0) translate(-50%,-100%)';
    const txt=me.r+' '+n,val=Math.round(disp[n]);
    if(txt!==o.txt){o.txt=txt;o.lab.firstChild.textContent=txt}
    if(val!==o.val){o.val=val;o.lab.lastChild.textContent=val;rows[n].querySelector('.pt').textContent=val+' pts'}
  });
  stepFx(dt,wdt);stepParticles(wdt);
  flare.material.opacity=Math.min(.8,fl);flareA*=Math.exp(-6*dt);ring.rotation.z=t*.15;
  /* camera director */
  const k=reduce?0:1,dist=portrait?25:17.5,R=portrait?20:14;
  dw+=(((cinOn&&dirT>0&&epic<=0)?1:0)-dw)*E(3.5);ew+=(((cinOn&&epic>0)?1:0)-ew)*E(4);
  tPos.set(Math.sin(t*.25)*(cinOn?3:0)+mx*5*k,6-my*2*k+(cinOn?Math.sin(t*.3)*.6:0),dist);tLook.set(0,2.9,0);
  if(cinOn){
    const ie=Math.max(0,1-introT/4.5),ei=ie*ie*ie;tPos.x-=16*ei;tPos.y+=10*ei;tPos.z+=18*ei;
    if(ew>.001){const wx=P[epicN].mesh.position.x,a=Math.min(1,Math.max(0,(3.2-epic)/3.2))*1.6-.8;
      tPos.lerp(aPos.set(wx*.5+Math.sin(a)*R,4.5+Math.sin(a*2)*1.2,Math.cos(a)*R),ew);tLook.lerp(aLook.set(wx,3.2,0),ew)}
    if(dw>.001){const o=P[dirN];tPos.lerp(aPos.set(o.mesh.position.x*.7+2,4+o.h*.35,(portrait?19:12)+o.h*.7),dw);tLook.lerp(aLook.set(o.mesh.position.x,o.h*.5+1.2,0),dw)}
  }
  tPos.x+=(Math.sin(t*19)+Math.sin(t*11.3))*.5*shake*k*.28;tPos.y+=(Math.sin(t*17)+Math.sin(t*9.7))*.5*shake*k*.28;
  camPos.lerp(tPos,E(6));camLook.lerp(tLook,E(6));
  const tf=(portrait?70:45)+Math.min(bs,1.6)*7*k;
  if(Math.abs(cam.fov-tf)>.02){cam.fov+=(tf-cam.fov)*E(8);cam.updateProjectionMatrix()}
  cam.position.copy(camPos);cam.lookAt(camLook);
  renderer.render(scene,cam);
}
sync();
loop();
</script>
